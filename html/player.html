<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">        
        <div id="player-container" style="display: none;">
            <video controls preload="metadata">
                <source id="video-source" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <div class="video-info">
                <h2 id="video-filename">Video</h2>
                <p><strong>File:</strong> <span id="video-file"></span></p>
            </div>
        </div>

        <div id="error-container" style="display: none;">
            <div class="error">
                <strong>Error:</strong> <span id="error-message"></span>
            </div>
        </div>
    </div>

    <script>
        // Get video filename from URL parameter
        const params = new URLSearchParams(window.location.search);
        const filename = params.get('file');

        if (!filename) {
            showError('No video file specified.');
        } else {
            loadVideo(filename);
        }

        function loadVideo(filename) {
            // Validate filename to prevent path traversal attacks
            if (filename.includes('..') || filename.includes('/')) {
                showError('Invalid filename.');
                return;
            }

            const videoPath = `/videos/${filename}`;
            const videoSource = document.getElementById('video-source');
            const playerContainer = document.getElementById('player-container');

            videoSource.src = videoPath;
            document.getElementById('video-filename').textContent = filename;
            document.getElementById('video-file').textContent = filename;
            playerContainer.style.display = 'block';

            // Test if video loads
            const video = document.querySelector('video');
            video.addEventListener('error', () => {
                showError(`Video file not found: ${filename}`);
                playerContainer.style.display = 'none';
            });
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-container').style.display = 'block';
        }
    </script>
</body>
</html>
